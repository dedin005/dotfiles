# =============================================================================
# Hyprland configuration
# =============================================================================

# Monitors
monitor=HDMI-A-1,highres,1920x1080,1
monitor=DP-1,highres,auto,auto

# Autostart
exec-once = swaybg --image=/home/charlie/.files/bg.jpg
exec-once = waybar
exec-once = hypridle
exec-once = /usr/local/bin/leds_off.sh

# Environment variables
env = XCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = HYPRLAND_NO_HW_CURSOR,1
# env = WLR_NO_HARDWARE_CURSORS,1   # legacy, replaced by HYPRLAND_NO_HW_CURSOR

# Logging (flip to true once things are stable)
debug:disable_logs = false

# =============================================================================
# Input
# =============================================================================
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = no
    }
}

# =============================================================================
# General
# =============================================================================
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(ff6ec7ff) rgba(a855f7ff) 45deg
    col.inactive_border = rgba(ffffff15)
    layout = dwindle
    resize_on_border = true
}

# =============================================================================
# Decoration
# =============================================================================
decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 0.93
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(0,0,0,0.45)
    }
}

# =============================================================================
# Animations
# =============================================================================
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOut, 0.0, 0.0, 0.2, 1.0
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, easeOut, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, easeOut, slide
}

# =============================================================================
# Layouts
# =============================================================================
dwindle {
    pseudotile = yes
    preserve_split = yes
    smart_split = false
}

master {
    new_status = slave
}

# =============================================================================
# Misc
# =============================================================================
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# =============================================================================
# Window rules (v3 syntax, Hyprland >= 0.53)
# =============================================================================
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(feh)$, float on
windowrule = match:class ^([Tt]hunar)$, match:title ^(File Operation*), float on

# =============================================================================
# Keybinds
# =============================================================================
$mainMod = ALT

# Session
bind = $mainMod, C, killactive
bind = $mainMod, Q, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, O, pseudo
bind = $mainMod, Return, togglesplit

# Lock / display
bind = SUPER, L, exec, hyprlock
bind = SUPER SHIFT, L, exec, ~/.config/hypr/scripts/lock-and-off.sh
bind = SUPER CTRL, L, exec, hyprctl dispatch dpms on

# Apps
bind = $mainMod CTRL, T, exec, alacritty
bind = $mainMod, T, exec, code
bind = $mainMod, P, exec, wofi --show drun
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, brave

# Screenshot — selection
bind = $mainMod, S, exec, grim -g "$(slurp)" - | tee /home/charlie/pictures/screenshot_"$(date +%F_%H.%M.%S)".png | feh -
# Screenshot — full screen
bind = $mainMod SHIFT, S, exec, grim - | tee /home/charlie/pictures/screenshot_"$(date +%F_%H.%M.%S)".png | feh -

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Focus (vim keys)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows (vim keys)
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# Resize windows (hold to repeat)
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
